; FCShadow2 (Commonwealth Engine Fixes): spreads the sun-shadow culling of pre-culled (previs) areas over the game's own
; helper threads. Same shadows as the game's single-thread version. Log: Documents\My Games\Fallout4\F4SE\FCShadow2.log
[General]
; master switch; 0 = loads but patches nothing
bEnable=1
; 1 = on when the game starts; F7 (iToggleKey) switches it on/off in game, at the next frame
bStartOn=1
iToggleKey=0x76
; 2 = walks on helper threads (normal); 1 = same output format but on the main thread only (diagnostics)
iMode=2
; diagnostics: compare against the game's own result on 1 shadow cull in iVerifyEvery (costs time on those frames)
bVerify=0
iVerifyEvery=120
; use helper threads only for culls whose walk took at least this long last time, with at least this many blocks
fMinWalkMs=0.08
iMinBlocks=3
iMaxJobs=4
; 1 = wake the helper threads at the start of the block loop (faster); 0 = at its end
bEarlyKick=1
; 1 = give the shadow records the same carry flag the game's single-list path writes (exact output); keep at 1
bFixCarry=1
; what the toggle key switches: 0 = FCShadow2 on/off; 1 = bEarlyKick (testing only)
iToggleWhat=0
