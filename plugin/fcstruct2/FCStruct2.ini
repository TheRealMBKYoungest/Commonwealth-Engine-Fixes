; FCStruct2 1.1.4 (STRUCT-2 FaceGen optimizer). Design: analysis/design/STRUCT-2-FaceGenOptimizer-TDD.md
; Log: My Games\Fallout4\F4SE\FCStruct2.log. The logging is always on; the parts below act only while ON.
[General]
bEnable=1
; starts ON; F6 toggles the whole optimizer
bStartOn=1
iToggleKey=0x75
; 1 = log every face-gate call instead of once per NPC (very verbose)
bLogEveryGate=0

[Gate]
; Part A: NPCs whose pre-made FaceGen files exist use them instead of live face painting.
; OFF by default: generic settler templates have pre-made heads without the hair the live painter adds (they go bald).
bEnable=0
; with bEnable=1: 0 = the NPC's winning plugin must be a master (ESM/ESL-flagged); 1 = also allow plain .esp winners
bAllowNonMasters=0
; with bEnable=1: NPCs that always keep the vanilla answer, comma-separated FormIDs (hex)
sExceptions=
; Force list, works even with bEnable=0: these NPCs use their pre-made FaceGen whenever the files exist (no master rule).
; Use it for story characters edited by a patch whose pre-made faces you want, e.g. Deirdre (UFO4P ships her FaceGen):
; sForceFaceGen=0003F23B
sForceFaceGen=

[SafetyNet]
; Part B: retry a failed paint job once; a second failure leaves the plain unpainted face (not Rust Face)
bEnable=1
; test only: fail every Nth paint start on purpose (0 = never)
iForceFailEvery=0
; test only: make the retry of a forced failure fail too (tests the plain-face fallback)
bForceFailRetryToo=0

[Queue]
; Part C: run more paint steps in the same frame while faces are ready (bounded by steps and time)
bEnable=1
iMaxStepsPerFrame=8
fBudgetMs=2.0
; Reuse face texture arrays between faces in the engine's own 128-slot cache mode, so repeated layers come from the cache
; (crowd test: average paint time 192 ms -> 3 ms, faces pixel-identical to vanilla). Costs extra video memory while active.
bArrayPool=1
; VRAM guard: when free video memory drops below this (MB), the pooled arrays are released and faces are painted the
; vanilla way until memory recovers (0 = no guard)
iPoolMinFreeVramMB=1024
; Calm release: once engaged, the guard waits until free video memory is above the limit plus this margin (MB) ...
iPoolReleaseMarginMB=768
; ... and has stayed engaged at least this many seconds before pooling again (stops rapid on/off switching)
iPoolHoldSec=30

[Diagnostics]
; Part D: log video-memory budget/usage every 10 s and at every failure
bLogVram=1
; test only: read every painted face back from the GPU and log a hash of its pixels (stalls the game; for A/B checks)
bVerifyFaceHash=0
